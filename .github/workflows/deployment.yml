name: Deploy

on: 
  workflow_run:
    workflows:
      - Build and push Conduit backened
      - Build and push Conduit frontend    
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Login to VM 
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_VM_KEY }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy all
        run: |
          echo "Detecting event type"
          EVENT="${{ github.event_name }}"
          pwd
          ls -la
          if [ "$EVENT" = "push" ]; then
            echo "Building Conduit and pushing to GHCR"
            git submodule update --init --recursive
            docker compose build
            docker compose push
          else
            echo "Full deploy not needed"
          fi

      - name: Deploy separate services
        run: |
          if 
            EVENT="${{ github.event.workflow_run.name }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
              
            if [ -z "$SHA" ]; then
              echo "Broken SHA. Exiting..."
              exit 1

            elif [ "$EVENT" = "Deploying Conduit backend" ]; then
              
              IMAGE="ghcr.io/${{ vars.GH_USERNAME }}/${{ vars.BACKEND_IMAGE_NAME }}:$SHA"
              git pull "$IMAGE"
              docker rm -f ${{ vars.BACKEND_IMAGE_NAME }} || true
              docker compose run ${{ vars.BACKEND_IMAGE_NAME }}

            elif [ "$EVENT" = "Deploying Conduit frontend" ]; then
              IMAGE="ghcr.io/${{ vars.GH_USERNAME }}/${{ vars.FRONTEND_IMAGE_NAME }}:$SHA"
              git pull "$IMAGE"
              docker rm -f ${{ vars.FRONTEND_IMAGE_NAME }} || true
              docker compose run ${{ vars.FRONTEND_IMAGE_NAME }}

            else
              echo "Unsupportet event: $EVENT
            fi
          fi
