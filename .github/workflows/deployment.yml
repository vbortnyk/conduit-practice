name: Deploy

on: 
  workflow_run:
    workflows: [
      Build and push Conduit backened
      Build and push Conduit frontend
      ]
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-lstest
    steps:
      - name: Login to VM 
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_VM_KEY }}

      - name: Deploy
        run: |
          echo "Detecting event type"
          EVENT="${{ github.event }}"

          if [ "$EVENT" = "push"]; then
            echo "Deploing Conduit"
            docker compose up -d

          else 
            EVENT=${{ github.event.workflow_run.name }}
            SHA="${{ github.event.workflow_run.head_sha }}"
              
            if [ -z $SHA ]; then
              echo "Broken SHA. Exiting..."
              exit 1

            elseif [ "$EVENT" = "Build and push Conduit backend" ]; then
              IMAGE="ghcr.io/${{ vars.GH_USERNAME }}/${{ BACKEND_IMAGE_NAME }}:$SHA"
              git pull $IMAGE
              docker rm -f ${{ BACKEND_IMAGE_NAME }} || true
              docker compose run ${{ BACKEND_IMAGE_NAME }}

            elseif [ "$WORKFLOW" = "Build and push Conduit frontend" ]; then
              IMAGE="ghcr.io/${{ vars.GH_USERNAME }}/${{ FRONTEND_IMAGE_NAME }}:$SHA"
              git pull $IMAGE
              docker rm -f ${{ FRONTEND_IMAGE_NAME }} || true
              docker compose run ${{ FTONTEND_IMAGE_NAME }}

            else
              echo "Unsupportet event: $EVENT
