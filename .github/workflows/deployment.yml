  detect-frontend-changes: 
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        # with:
        #   submodules: true
        #   fetch-depth: 0

      - name: Check submodule changes
        id: check
        run: |
          if git diff ${{ github.event.before }} ${{ github.sha }}
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  detect-backend-changes: 
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        # with:
        #   submodules: true
        #   fetch-depth: 0

      - name: Check submodule changes
        id: check
        run: |
          if git diff ${{ github.event.before }} ${{ github.sha }}
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
        
  build-frontend:
    needs: detect-frontend-changes
    runs-on: ubuntu-latest
    outputs:
      rebuilt: ${{ needs.detect-frontend-changes.outputs.changed }}
    steps:
      - name: Build frontend
        id: required
        if: needs.detect-frontend-changes.outputs.changed == 'true'
        run: echo "reubild=true" >> $GITHUB_OUTPUT
      - name: Build frontend
        if: needs.detect-frontend-changes.outputs.changed == 'false'
        run: echo "rebuid=false" >> $GITHUB_OUTPUT
        
        env:
            PY_VERSION: ${{ vars.NODE_VERSION }}
      - uses: actions/checkout@v4
        with: 
          submodules: recursive
      - name: Build Docker images
        run: |
          cd conduit-frontend
          docker compose build 
      
    

  build-backend:
    needs: detect-backend-changes
    runs-on: ubuntu-latest
    if: needs.detect-backend-changes.outputs.changed == 'true'
    steps:
      - name: Check backend build required
        if: needs.detect-backend-changes.outputs.changed == 'true'
        run: echo 'Build required TRUE'
      - name: Checkout backend
        run: echo "building..."
        env:
            PY_VERSION: ${{ vars.PY_VERSION }}
      - uses: actions/checkout@v4
        # with: 
        #   submodules: recursive
      - name: Build backend Docker image
        run: |
          cd ./conduit-backend
          docker compose build
          echo "backend-rebuilt=true" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    env:
      NODE_VERSION: ${{ vars.NODE_VERSION }}
    steps: 
      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_VM_KEY }}
          # script: |
            # if [ "${{ steps.detect-backend-changes.changed }}" = "true" ] && [ "${{ steps.changes.outputs.frontend }}" = "true" ];    then
            # docker compose up -d --build
            # elif [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
            # docker compose up -d backend --build
            # elif [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            # docker compose up -d frontend --build
            # fi
          script: |
             cd ~/projects/conduit-container
             docker compose up -d --force-recreate


