on: 
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_SSH_KEY }}

      - name: Add GitHub to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GHCR
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ vars.GH_USERNAME }}
          password: ${{ secrets.GH_PAT }}   
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./conduit-backend-practice
          push: true
          tags: ghcr.io/${{ vars.GH_USERNAME }}/${{ vars.IMAGE_NAME }}:latest

  deploy:
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    needs: build-and-push
    steps: 
      - name: Login to VM 
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_VM_KEY }}
          script: |
            git pull
            git submodule update --init --recursive
            docker compose up -d
            # docker pull ghcr.io/${{ vars.GH_USERNAME }}/${{ vars.IMAGE_NAME }}:latest     # ${{ vars.IMAGE_TAG }}
            # docker run -d ghcr.io/${{ vars.GH_USERNAME }}/${{ vars.IMAGE_NAME }}:latest   # ${{ vars.IMAGE_TAG }}
