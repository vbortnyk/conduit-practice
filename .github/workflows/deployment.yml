  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_SSH_KEY }}

      - name: Add GitHub to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ vars.GH_USERNAME }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Verify submodules exist
        run: |
          ls -la
          ls -la conduit-backend || true    
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ vars.GH_USERNAME }}/${{ vars.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    # needs: [build-backend, build-frontend]
    env:
      NODE_VERSION: ${{ vars.NODE_VERSION }}
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GH_USERNAME }}
          password: ${{ secrets.GH_TOKEN }}
          scope: 'myorg/myimage@push'
      
      - name: Login to VM 
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_VM_KEY }}

      - name: Pull image from GHCR and run
        run: |
          docker pull ghcr.io/${{ vars.GH_USERNAME }}/${{ vars.IMAGE_NAME }}:latest
          docker run -d ghcr.io/${{ vars.GH_USERNAME }}/${{ vars.IMAGE_NAME }}:latest
          
          







          

