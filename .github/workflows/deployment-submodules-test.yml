name: Deployment submodule

on: 
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

      service:
        required: true
        type: string

      gh-username:
        required: true
        type: string 
      
      vps-username:
        required: true
        type: string

      vps-host:
        required: true
        type: string

    # secrets:
    #   GH_PAT:
    #     required: true
    

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive

      - name: Login to GHCR
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ inputs.gh-username }}
          password: ${{ secrets.GH_PAT }}   
      
      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ inputs.gh-username }}/${{ inputs.service }}:${{ github.sha }}
       
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Login to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ inputs.vps-host }}
          username: ${{ inputs.vps-username }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io \
              -u "${{ inputs.gh-username }}" \
              --password-stdin

            cd projects/conduit-container
            TAG=${{ inputs.tag }} docker compose pull ${{ inputs.service }}
            TAG=${{ inputs.tag }} docker compose up -d --no-deps --force-recreate ${{ inputs.service }}