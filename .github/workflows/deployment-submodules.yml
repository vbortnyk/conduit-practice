name: Deployment submodule

on: 
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

      service:
        required: true
        type: string

      username:
        required: true
        type: string     
    secrets:
      GH_PAT:
        required: true
    

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive

      - name: Login to GHCR
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ vars.GH_USERNAME }}
          password: ${{ secrets.GH_PAT }}   
      
      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.service }}
          push: true
          tags: ghcr.io/${{ vars.GH_USERNAME }}/${{ inputs.service }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Login to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io \
              -u "${{ vars.GH_USERNAME }}" \
              --password-stdin

            cd projects/conduit-container
            TAG=${{ inputs.tag }} docker compose pull ${{ inputs.service }}
            TAG=${{ inputs.tag }} docker compose up -d --no-deps --force-recreate ${{ inputs.service }}