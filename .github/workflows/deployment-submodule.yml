name: Deployment submodule

on: 
  workflow_call:
    inputs:
      # image:
      #   required: true
      #   type: string
      tag:
        required: true
        type: string

      service:
        required: true
        type: string

      username:
        required: true
        type: string     
    secrets:
      GH_PAT:
        required: true
    

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ inputs.username }}
          password: ${{ secrets.GH_PAT }}
      
      - name: Pull image
        run: |

          TAG=${{ inputs.tag }} docker compose pull ${{ inputs.service }}
          TAG=${{ inputs.tag }} docker compose up -d --no-deps --force-recreate ${{ inputs.service }}