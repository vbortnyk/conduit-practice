name: Deployment submodule

on: 
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      tag:
        required: true
        type: string
      username:
        required: true
        type: string     
    secrets:
      GH_PAT:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ inputs.username }}
          password: ${{ secrets.GH_PAT }}
      
      - name: Pull image
        run: |
          docker pull ${{ inputs.image }}
          docker rm -f ${{ inputs.image }} || true
          docker compose run -d ${{ inputs.image }}